services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000

  pathway-worker:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: python -m src.rag.pathway_pipeline
    depends_on:
      - api
